<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>温泉スロット</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --bg-color: #0d0f1d;
      --card-bg: rgba(23, 27, 50, 0.8);
      --accent-neon: #00f3ff;
      --pink-neon: #ff0055;
      --yellow-neon: #ffe600;
      --text-color: #ffffff;
    }

    body {
      background: radial-gradient(circle at top, #1a1f3c 0%, var(--bg-color) 100%);
      color: var(--text-color);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px 15px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      font-size: 22px;
      color: var(--accent-neon);
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
      margin-bottom: 10px;
    }

    /* 確変アナウンスバナー */
    #fever-banner {
      display: none;
      background: linear-gradient(90deg, #ff0055, #ffe600, #ff0055);
      background-size: 200% 200%;
      animation: gradient-slide 2s ease infinite;
      color: #000;
      font-weight: bold;
      padding: 8px;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 15px;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
    }

    @keyframes gradient-slide {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 情報表示カード */
    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--accent-neon);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      border-radius: 12px;
      padding: 15px;
      margin: 0 auto 20px auto;
      max-width: 340px;
      font-size: 14px;
    }

    /* 確変時の枠チェンジ */
    .status-card.fever-mode {
      border-color: var(--pink-neon);
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
    }

    /* メーター表示 */
    .meter-container {
      background: #15182e;
      border-radius: 10px;
      height: 12px;
      width: 100%;
      margin: 8px 0;
      overflow: hidden;
      border: 1px solid #333;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-neon), var(--pink-neon));
      transition: width 1s ease-in-out;
    }

    /* スロット枠 */
    .slot-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .reel {
      width: 85px;
      height: 100px;
      background: rgba(15, 18, 37, 0.9);
      border: 2px solid #3b4268;
      border-radius: 16px;
      font-size: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
      transition: all 0.3s ease;
    }

    .reel.fever-border {
      border-color: var(--yellow-neon);
      box-shadow: 0 0 15px rgba(255, 230, 0, 0.8);
    }

    .reel.spinning {
      border-color: var(--pink-neon);
      animation: pulse 0.15s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }

    /* ボタン */
    .spin-btn {
      background: linear-gradient(135deg, var(--pink-neon) 0%, #a800ff 100%);
      color: #fff;
      border: none;
      padding: 16px 0;
      width: 100%;
      max-width: 300px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
    }

    .spin-btn.fever-btn {
      background: linear-gradient(135deg, var(--yellow-neon) 0%, var(--pink-neon) 100%);
      color: #000;
      box-shadow: 0 0 25px rgba(255, 230, 0, 0.8);
    }

    .coupon {
      display: none;
      background: rgba(255,230,0,0.15);
      border: 2px solid var(--yellow-neon);
      box-shadow: 0 0 20px rgba(255, 230, 0, 0.4);
      border-radius: 16px;
      padding: 20px;
      margin: 20px auto 0 auto;
      max-width: 320px;
    }
  </style>
</head>
<body>

  <h1>温泉環境連動スロット</h1>

  <div id="fever-banner">🔥 不快指数80超え！当選確率70% 超確変中 🔥</div>

  <div class="status-card" id="status-card">
    <div id="user-name" style="color:var(--accent-neon); font-weight:bold; margin-bottom:5px;"></div>
    <div>本日の不快指数: <b id="di-val" style="font-size:18px; color:var(--yellow-neon);">-</b></div>
    
    <div style="margin-top:10px; font-size:12px; color:#aaa;">本日の「サウナ＆外気浴ととのい度」</div>
    <div class="meter-container">
      <div class="meter-fill" id="meter-fill"></div>
    </div>
    <div id="totonoi-text" style="font-size:12px; color:var(--accent-neon);">環境分析中...</div>
  </div>

  <div class="slot-container">
    <div class="reel" id="reel1">♨️</div>
    <div class="reel" id="reel2">♨️</div>
    <div class="reel" id="reel3">♨️</div>
  </div>

  <button class="spin-btn" id="spin-btn" onclick="startSpin()">スロットを回す！</button>

  <div class="coupon" id="coupon-card">
    <h3 style="color:var(--yellow-neon); margin:0 0 10px 0;">🎉 当選クーポン獲得！</h3>
    <div id="coupon-title" style="font-size:18px; font-weight:bold; color:#fff;"></div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzUMPfrYJ1Fir8Tk45LOsdOzEo7VKDH1c5LxUK9uT81Wwq63t-5ui9CJ3AQMi_lHRb6HA/exec";
    const LIFF_ID = "YOUR_LIFF_ID_HERE";

    let resultData = null;
    const symbols = ["♨️", "🎰", "🍺", "🦆", "🌸", "7️⃣"];

    window.onload = async () => {
      try {
        await liff.init({ liffId: LIFF_ID });
        let userName = "ゲスト";
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          userName = profile.displayName;
        }
        document.getElementById("user-name").innerText = `ようこそ、${userName} さん`;

        const res = await fetch(GAS_URL);
        resultData = await res.json();
        
        // 数値反映
        document.getElementById("di-val").innerText = resultData.di;
        
        // ととのいゲージ（不快指数に応じてゲージが伸びる）
        const meterPercent = Math.min(100, Math.max(30, resultData.di));
        document.getElementById("meter-fill").style.width = meterPercent + "%";
        document.getElementById("totonoi-text").innerText = resultData.di >= 80 
          ? "絶好のととのい日和！冷やし炭酸泉が最高です" 
          : "適度な温泉日和！のんびり露天風呂がおすすめ";

        // 確変演出の切り替え
        if (resultData.di >= 80) {
          document.getElementById("fever-banner").style.display = "block";
          document.getElementById("status-card").classList.add("fever-mode");
          document.querySelectorAll(".reel").forEach(r => r.classList.add("fever-border"));
          const btn = document.getElementById("spin-btn");
          btn.classList.add("fever-btn");
          btn.innerText = "🔥 超高確率スロットを回す！";
        }

      } catch (e) {
        document.getElementById("status-card").innerText = "データ読み込みエラー";
      }
    };

    function startSpin() {
      if (!resultData) return alert("データ読み込み中です");
      
      const btn = document.getElementById("spin-btn");
      btn.disabled = true;
      document.getElementById("coupon-card").style.display = "none";

      const reels = [
        document.getElementById("reel1"),
        document.getElementById("reel2"),
        document.getElementById("reel3")
      ];

      reels.forEach(r => r.classList.add("spinning"));

      let timer = setInterval(() => {
        reels.forEach(r => {
          r.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        });
      }, 70);

      setTimeout(() => {
        clearInterval(timer);
        reels.forEach(r => r.classList.remove("spinning"));

        if (resultData.isWin) {
          reels.forEach(r => r.innerText = "7️⃣");
          document.getElementById("coupon-title").innerText = resultData.couponName;
          document.getElementById("coupon-card").style.display = "block";
        } else {
          reels[0].innerText = "♨️";
          reels[1].innerText = "🍺";
          reels[2].innerText = "♨️";
          alert("ハズレ... また挑戦してね！");
        }
        btn.disabled = false;
      }, 2000);
    }
  </script>
</body>
</html>
