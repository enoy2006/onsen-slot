<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>温泉スロット</title>
  <style>
    :root {
      --bg-color: #0d0f1d;
      --card-bg: rgba(23, 27, 50, 0.8);
      --accent-neon: #00f3ff;
      --pink-neon: #ff0055;
      --yellow-neon: #ffe600;
      --text-color: #ffffff;
    }

    body {
      background: radial-gradient(circle at top, #1a1f3c 0%, var(--bg-color) 100%);
      color: var(--text-color);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px 15px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      font-size: 22px;
      color: var(--accent-neon);
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
      margin-bottom: 15px;
    }

    /* 不快指数エリア */
    #di-display {
      background: var(--card-bg);
      border: 1px solid var(--accent-neon);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      border-radius: 12px;
      padding: 12px;
      margin: 0 auto 25px auto;
      max-width: 340px;
      font-size: 15px;
      color: #d1d5db;
    }
    #di-display b {
      color: var(--yellow-neon);
      font-size: 18px;
    }

    /* スロット枠 */
    .slot-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .reel {
      width: 85px;
      height: 100px;
      background: rgba(15, 18, 37, 0.9);
      border: 2px solid #3b4268;
      border-radius: 16px;
      font-size: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }

    .reel.spinning {
      border-color: var(--pink-neon);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
      animation: pulse 0.2s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }

    /* ボタン */
    .spin-btn {
      background: linear-gradient(135deg, var(--pink-neon) 0%, #a800ff 100%);
      color: #fff;
      border: none;
      padding: 16px 0;
      width: 100%;
      max-width: 300px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .spin-btn:active {
      transform: scale(0.95);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
    }

    .spin-btn:disabled {
      background: #4a4e69;
      box-shadow: none;
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* クーポンカード */
    .coupon {
      display: none;
      background: linear-gradient(135deg, rgba(255,230,0,0.15) 0%, rgba(255,0,85,0.15) 100%);
      border: 2px solid var(--yellow-neon);
      box-shadow: 0 0 20px rgba(255, 230, 0, 0.3);
      border-radius: 16px;
      padding: 20px;
      margin: 25px auto 0 auto;
      max-width: 320px;
    }
    .coupon h3 {
      color: var(--yellow-neon);
      margin: 0 0 10px 0;
      text-shadow: 0 0 8px rgba(255, 230, 0, 0.5);
    }
  </style>
</head>
<body>

  <h1>温泉環境連動スロット</h1>

  <div id="di-display">不快指数を計測中...</div>

  <div class="slot-container">
    <div class="reel" id="reel1">♨️</div>
    <div class="reel" id="reel2">♨️</div>
    <div class="reel" id="reel3">♨️</div>
  </div>

  <button class="spin-btn" id="spin-btn" onclick="startSpin()">スロットを回す！</button>

  <div class="coupon" id="coupon-card">
    <h3>🎉 当選クーポン獲得！</h3>
    <div id="coupon-title" style="font-size:18px; font-weight:bold; color:#fff;"></div>
  </div>

  <script>
    // ★ ご自身のGAS WebアプリURLを設定してください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzUMPfrYJ1Fir8Tk45LOsdOzEo7VKDH1c5LxUK9uT81Wwq63t-5ui9CJ3AQMi_lHRb6HA/exec";

    let resultData = null;
    const symbols = ["♨️", "🎰", "🍺", "🦆", "🌸", "7️⃣"];

    window.onload = async () => {
      try {
        const res = await fetch(GAS_URL);
        resultData = await res.json();
        document.getElementById("di-display").innerHTML = `本日の不快指数: <b>${resultData.di}</b><br><small style="color:#00f3ff;">※指数に応じた高確率モード適用中</small>`;
      } catch (e) {
        document.getElementById("di-display").innerText = "データの読み込みに失敗しました";
      }
    };

    function startSpin() {
      if (!resultData) return alert("データ読み込み中です");
      
      const btn = document.getElementById("spin-btn");
      btn.disabled = true;
      document.getElementById("coupon-card").style.display = "none";

      const reels = [
        document.getElementById("reel1"),
        document.getElementById("reel2"),
        document.getElementById("reel3")
      ];

      reels.forEach(r => r.classList.add("spinning"));

      let timer = setInterval(() => {
        reels.forEach(r => {
          r.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        });
      }, 80);

      setTimeout(() => {
        clearInterval(timer);
        reels.forEach(r => r.classList.remove("spinning"));

        if (resultData.isWin) {
          reels.forEach(r => r.innerText = "7️⃣");
          document.getElementById("coupon-title").innerText = resultData.couponName;
          document.getElementById("coupon-card").style.display = "block";
        } else {
          reels[0].innerText = "♨️";
          reels[1].innerText = "🍺";
          reels[2].innerText = "♨️";
          alert("ハズレ... また挑戦してね！");
        }
        btn.disabled = false;
      }, 2000);
    }
  </script>
</body>
</html>
